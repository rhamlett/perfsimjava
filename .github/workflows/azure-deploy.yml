# =============================================================================
# Performance Problem Simulator - Java Blessed Image
# GitHub Actions Workflow for Azure App Service Deployment
# =============================================================================

name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  AZURE_WEBAPP_NAME: perfsimjava2
  AZURE_RESOURCE_GROUP: rhamlettRG
  
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -B
    
    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: java-app
        path: target
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Stop App Service and Clear Container Config
      run: |
        # Stop the app first
        az webapp stop \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }}
        
        # Clear container settings
        az webapp config container delete \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} || true
        
        # Remove all DOCKER-related app settings that force container mode
        az webapp config appsettings delete \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --setting-names DOCKER_REGISTRY_SERVER_URL DOCKER_REGISTRY_SERVER_USERNAME DOCKER_REGISTRY_SERVER_PASSWORD DOCKER_CUSTOM_IMAGE_NAME WEBSITES_ENABLE_APP_SERVICE_STORAGE || true
        
        # Wait for config to propagate
        sleep 10
    
    - name: Configure App Service for Java 25 SE
      run: |
        # Set Java SE runtime stack (format: JAVA|<version>-java<version>)
        az webapp config set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --linux-fx-version "JAVA|25-java25" \
          --web-sockets-enabled true
        
        # Ensure app settings for Java
        az webapp config appsettings set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --settings WEBSITES_PORT=8080
        
        # Wait for config to propagate
        sleep 10
    
    - name: Rename JAR for deployment
      run: |
        JAR_FILE=$(ls target/*.jar | head -1)
        mv "$JAR_FILE" target/app.jar
    
    - name: Deploy to Azure Web App
      run: |
        az webapp deploy \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --src-path target/app.jar \
          --type jar \
          --clean true
    
    - name: Start App Service
      run: |
        az webapp start --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME }}
        echo "Deployment complete. App will be available at https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
