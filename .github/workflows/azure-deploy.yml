# =============================================================================
# Performance Problem Simulator - Java Blessed Image
# GitHub Actions Workflow for Azure App Service Deployment
# =============================================================================

name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  AZURE_WEBAPP_NAME: perfsimjava
  AZURE_RESOURCE_GROUP: rhamlettRG
  
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -B
    
    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: java-app
        path: target
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Stop App Service and Clear Container Config
      run: |
        # Stop the app first
        az webapp stop \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }}
        
        # Clear container settings (must happen before setting runtime)
        az webapp config container delete \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} || true
        
        # Wait for config to propagate
        sleep 10
    
    - name: Configure App Service for Java 21 SE
      run: |
        # Set Java SE runtime stack
        az webapp config set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --linux-fx-version "JAVA|21-java21" \
          --web-sockets-enabled true
    
    - name: Rename JAR for deployment
      run: |
        JAR_FILE=$(ls target/*.jar | head -1)
        mv "$JAR_FILE" target/app.jar
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: target/app.jar
    
    - name: Set Startup Command
      run: |
        az webapp config set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --startup-file "java -Xms256m -Xmx512m -XX:+UseG1GC -jar /home/site/wwwroot/app.jar --server.port=8080"
    
    - name: Start App Service
      run: |
        az webapp start --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME }}
        echo "Deployment complete. App will be available at https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
