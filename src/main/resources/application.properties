# =============================================================================
# Performance Problem Simulator - Java
# Spring Boot Application Properties
# =============================================================================

# Import optional .env file for local development overrides (gitignored).
# Spring Boot reads key=value pairs from this file as properties.
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Application Name
spring.application.name=perfsimjava

# =============================================================================
# PerfSim Configuration
# =============================================================================

# Metrics broadcast interval (ms) - how often charts update
perfsim.metrics-interval-ms=250

# Probe interval (ms) - for latency monitor dashboard
# Can be overridden by HEALTH_PROBE_RATE environment variable
# Minimum: 100ms, Default: 200ms
perfsim.probe-interval-ms=200

# Default simulation duration (ms)
perfsim.default-duration-ms=30000

# Maximum simulation duration (ms) - 2 minutes
perfsim.max-duration-ms=120000

# Event log buffer size
perfsim.event-log-size=500

# Metrics history buffer size (for request latency chart)
perfsim.metrics-history-size=300

# Memory pressure configuration
perfsim.memory.chunk-size-mb=10
perfsim.memory.max-chunks=500

# CPU stress configuration
perfsim.cpu.default-workers=4
perfsim.cpu.max-workers=32

# Thread starvation configuration
perfsim.thread.starvation.default-count=50
perfsim.thread.starvation.max-count=200

# =============================================================================
# OpenAPI / Swagger Configuration
# =============================================================================
springdoc.swagger-ui.path=/swagger

# =============================================================================
# Idle Timeout Configuration
# =============================================================================

# Idle timeout in minutes. When the app is idle for this duration, health probes
# stop being sent to reduce unnecessary traffic to AppLens and Application Insights.
# The app wakes up automatically when the page is reloaded.
# Can be overridden by IDLE_TIMEOUT_MINUTES environment variable.
# Set to 0 to disable idle timeout.
# Default: 20 minutes
# perfsim.idle-timeout-minutes=20

# =============================================================================
# Spring Boot Actuator (Health Endpoints)
# =============================================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# =============================================================================
# Logging Configuration
# =============================================================================

logging.level.root=INFO
logging.level.com.microsoft.azure.samples.perfsimjava=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.websocket=DEBUG

# Pattern for console output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# =============================================================================
# Jackson JSON Serialization
# =============================================================================

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non-null

# =============================================================================
# Internationalization (i18n) Settings
# =============================================================================

# UI language code (ISO 639-1). Default: en (English, no translation needed).
# Override with UI_LANGUAGE environment variable.
perfsim.ui-language=${UI_LANGUAGE:en}

# Azure Cognitive Services Translator API key (required for non-English languages).
# Override with TRANSLATOR_API_KEY environment variable.
perfsim.translator-api-key=${TRANSLATOR_API_KEY:}

# Azure Translator endpoint URL.
# Override with TRANSLATOR_ENDPOINT environment variable.
perfsim.translator-endpoint=${TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}

# Azure Translator resource region.
# Override with TRANSLATOR_REGION environment variable.
perfsim.translator-region=${TRANSLATOR_REGION:eastus}
spring.jackson.serialization.indent-output=true

# =============================================================================
# Static Resources Configuration
# =============================================================================

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
